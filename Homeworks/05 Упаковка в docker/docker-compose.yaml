name: promocode-factory

services:
  promocode-factory-api:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: promocode-factory-api:local
    container_name: promocode-factory-api
    restart: unless-stopped
    ports:
      - "8091:8080"
    volumes:
      - db:/app/db
    environment:
      # Среда разработки: приложение накатывает миграции и заполняет БД тестовыми данными
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      # Переопределяет ConnectionStrings:PromocodeFactoryDb из appsettings.json
      ConnectionStrings__PromocodeFactoryDb: "Filename=/app/db/PromoCodeFactoryDb.sqlite"

volumes:
  db:
