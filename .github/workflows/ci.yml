name: ci

on:
  push:
    branches:
      - main
    paths:
      - "Homeworks/06 Настройка CI/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ env.REGISTRY }}/${{ github.repository }}/promocode-factory-api
  SRC_DIR: Homeworks/06 Настройка CI/src

jobs:
  build-test-publish:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        working-directory: ${{ env.SRC_DIR }}
        run: dotnet restore PromoCodeFactory.slnx
      - name: Build
        working-directory: ${{ env.SRC_DIR }}
        run: dotnet build PromoCodeFactory.slnx --configuration Release --no-restore
      - name: Test
        working-directory: ${{ env.SRC_DIR }}
        run: dotnet test PromoCodeFactory.UnitTests/PromoCodeFactory.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.SRC_DIR }}/TestResults
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SRC_DIR }}
          file: ${{ env.SRC_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
